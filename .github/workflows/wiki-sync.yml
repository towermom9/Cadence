name: Sync GitHub Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync wiki directory to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          rm -rf /tmp/wiki-repo
          if ! git clone "$WIKI_URL" /tmp/wiki-repo 2>/dev/null; then
            echo "::notice::GitHub Wiki repository is not initialized yet. Create at least one page in the Wiki tab on GitHub, then re-run this workflow."
            exit 0
          fi
          find /tmp/wiki-repo -maxdepth 1 -type f -name "*.md" -delete
          cp wiki/*.md /tmp/wiki-repo/
          cd /tmp/wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to push."
            exit 0
          fi
          git commit -m "Sync wiki from main (${GITHUB_SHA::7})"
          git push origin HEAD
