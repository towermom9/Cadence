name: Publish Docker Image

on:
  # 1. Manual trigger ("Run workflow" button in GitHub Actions tab)
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom image tag (leave empty to use package.json version)"
        required: false
        default: ""
      platforms:
        description: "Target platforms"
        required: false
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

  # 2. Trigger automatically when package.json or lavalink config changes on main, or on v*.*.* tags
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "lavalink/**"
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LAVALINK_IMAGE_NAME: ${{ github.repository }}-lavalink

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Cadence
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=raw,value=v${{ steps.pkg.outputs.version }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=sha-

      - name: Build and push Cadence Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cadence
          cache-to: type=gha,mode=max,scope=cadence

      - name: Extract Docker metadata for Cadence Lavalink
        id: meta_lavalink
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.LAVALINK_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=raw,value=v${{ steps.pkg.outputs.version }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=sha-

      - name: Build and push Cadence Lavalink Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./lavalink
          file: ./lavalink/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta_lavalink.outputs.tags }}
          labels: ${{ steps.meta_lavalink.outputs.labels }}
          cache-from: type=gha,scope=lavalink
          cache-to: type=gha,mode=max,scope=lavalink
