server:
    port: ${SERVER_PORT:2333}
    address: 0.0.0.0
    http2:
        enabled: true

plugins:
    youtube:
        enabled: true
        allowSearch: true
        allowDirectVideoIds: true
        allowDirectPlaylistIds: true
        clients:
            - MUSIC
            - WEB
            - ANDROID_VR
            - MWEB
            - IOS
            - TV
            - WEBEMBEDDED
            - TVHTML5_SIMPLY
        oauth:
            enabled: ${YT_OAUTH_ENABLED:false}
            refreshToken: "${YT_OAUTH_REFRESH_TOKEN:}"
        remoteCipher:
            url: "${YT_CIPHER_URL:http://yt-cipher:8001}"
            password: "${YT_CIPHER_PASSWORD:}"
            userAgent: ""

    lavasrc:
        providers:
            - 'ytmsearch:"%ISRC%"'
            - 'ytsearch:"%ISRC%"'
            - "ytmsearch:%QUERY%"
            - "ytsearch:%QUERY%"
        sources:
            spotify: true
            applemusic: ${APPLE_MUSIC_ENABLED:false}
            deezer: ${DEEZER_ENABLED:false}
            yandexmusic: false
            flowerytts: false
            youtube: false
            vkmusic: false
        lyrics-sources:
            spotify: false
            deezer: false
            youtube: true
            yandexmusic: false
            vkmusic: false
        spotify:
            clientId: "${SPOTIFY_CLIENT_ID:}"
            clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
            countryCode: "US"
            playlistLoadLimit: 6
            albumLoadLimit: 6
            resolveArtistsInSearch: true
            localFiles: false
            preferPartnerApi: true
            preferV1SearchApi: false
            customTokenEndpoint: "${SPOTIFY_TOKEN_ENDPOINT:http://spotify-tokener:49152/api/token}"
        deezer:
            masterDecryptionKey: "${DEEZER_MASTER_KEY:}"
            arl: "${DEEZER_ARL:}"
            formats: ["FLAC", "MP3_320", "MP3_256", "MP3_128", "MP3_64", "AAC_64"]
        applemusic:
            countryCode: "US"
            mediaAPIToken: "${APPLE_MUSIC_TOKEN:}"
            playlistLoadLimit: 6
            albumLoadLimit: 6
        youtube:
            countryCode: "US"

    lavalyrics:
        sources:
            - spotify
            - youtube
            - deezer

lavalink:
    plugins:
        - dependency: "dev.lavalink.youtube:youtube-plugin:${YT_PLUGIN_VERSION:e41dd95f8bd134b51e75080fb28cc805fecb431a}"
          snapshot: true
        - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:${LAVASRC_PLUGIN_VERSION:4.8.3}"
          snapshot: false
        - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:${LAVALYRICS_PLUGIN_VERSION:1.1.0}"
          snapshot: false
    server:
        password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
        sources:
            youtube: false
            bandcamp: true
            soundcloud: true
            twitch: true
            vimeo: true
            nico: true
            http: true
            local: false
        filters:
            volume: true
            equalizer: true
            karaoke: true
            timescale: true
            tremolo: true
            vibrato: true
            distortion: true
            rotation: true
            channelMix: true
            lowPass: true
        nonAllocatingFrameBuffer: false
        bufferDurationMs: 200
        frameBufferDurationMs: 600
        opusEncodingQuality: 10
        resamplingQuality: LOW
        trackStuckThresholdMs: ${TRACK_STUCK_THRESHOLD_MS:20000}
        useSeekGhosting: true
        youtubePlaylistLoadLimit: 6
        playerUpdateInterval: 5
        youtubeSearchEnabled: true
        soundcloudSearchEnabled: true
        gc-warnings: true

metrics:
    prometheus:
        enabled: false
        endpoint: /metrics

logging:
    file:
        path: ./logs/
    level:
        root: INFO
        lavalink: INFO
        dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
    logback:
        rollingpolicy:
            max-file-size: 500MB
            max-history: 7
